title = "rhoai-3.x-cluster gitleaks config"

[extend]
# Start from gitleaks' default ruleset (AWS keys, generic API keys/tokens,
# private keys, etc.) and layer on rules for this repo's own token shapes.
useDefault = true

[[rules]]
id = "maas-api-key"
description = "MaaS / OpenAI-style API key (sk-oai-...)"
regex = '''sk-oai-[A-Za-z0-9_-]{20,}'''
tags = ["key", "maas"]

[[rules]]
id = "generic-high-entropy-secret-assignment"
description = "key/token/password/secret assigned a long opaque value in YAML"
regex = '''(?i)(api[_-]?token|api[_-]?key|password|secret|access[_-]?key)\s*:\s*['"]?[A-Za-z0-9/+=_-]{16,}['"]?'''
tags = ["generic"]

[allowlist]
description = "literal placeholder text only (not whole paths/files)"
regexes = [
  '''CHANGE_ME''',
  '''<[A-Za-z0-9_-]+>''',
]
