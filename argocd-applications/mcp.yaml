apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-mcp-server
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/containers/charts/kubernetes-mcp-server
      targetRevision: 0.1.0
      path: .
      helm:
        valueFiles:
          - $values/helm-values/kubernetes-mcp/values.yaml
    - repoURL: https://github.com/pdavis327/rhoai-3.x-cluster
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-demo
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
