apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-models-as-a-service
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/pdavis327/rhoai-3.x-cluster
    targetRevision: main
    path: projects/models-as-a-service
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: models-as-a-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
  - group: rbac.authorization.k8s.io
    kind: Role
    jqPathExpressions:
    - .metadata.annotations["platform.opendatahub.io/instance.uid"]
    - .metadata.annotations["platform.opendatahub.io/instance.generation"]
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
    jqPathExpressions:
    - .metadata.annotations["platform.opendatahub.io/instance.uid"]
    - .metadata.annotations["platform.opendatahub.io/instance.generation"]
