# LocalQueues — exported from cluster.
# Namespaces (whisper-demo, ray-workshop) must already exist; this repo does not create them.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default
  namespace: whisper-demo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    opendatahub.io/managed: "false"
spec:
  clusterQueue: default
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: large-gpu
  namespace: whisper-demo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    opendatahub.io/managed: "false"
spec:
  clusterQueue: large-gpu-cq
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: small-gpu
  namespace: whisper-demo
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    opendatahub.io/managed: "false"
spec:
  clusterQueue: small-gpu-cq
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default
  namespace: ray-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    opendatahub.io/managed: "false"
spec:
  clusterQueue: default
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: ray-workshop-queue
  namespace: ray-workshop
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    opendatahub.io/managed: "false"
    kueue.x-k8s.io/default-queue: "true"
spec:
  clusterQueue: default
  stopPolicy: None
