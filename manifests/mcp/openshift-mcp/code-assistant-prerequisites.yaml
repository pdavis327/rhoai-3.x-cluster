---
# Prerequisites for OpenShift MCP Server deployed from the RHOAI MCP catalog.
# The lifecycle operator validates these exist before reconciling the MCPServer CR.
# See: https://github.com/kubernetes-sigs/mcp-lifecycle-operator/issues/226
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshift-mcp-server-config
  namespace: code-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  config.toml: |
    log_level = 5
    port = "8080"
    read_only = true
    toolsets = ["core", "config"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-viewer
  namespace: code-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-assistant-mcp-viewer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: mcp-viewer
    namespace: code-assistant
