apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: my-server
spec:
  distribution:
    name: rh-dev
  workload:
    replicas: 1
    storage:
      size: "20Gi"
    overrides:
      env:
        - name: OLLAMA_INFERENCE_MODEL
          value: "llama3.2:1b"
        - name: OLLAMA_URL
          value: "http://ollama-server-service.ollama-dist.svc.cluster.local:11434"