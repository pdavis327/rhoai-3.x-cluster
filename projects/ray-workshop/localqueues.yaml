# LocalQueues for ray-workshop. ClusterQueues live in cluster-config/kueue/.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: default
  namespace: ray-workshop
  annotations:
    opendatahub.io/managed: "false"
spec:
  clusterQueue: default
  stopPolicy: None
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: ray-workshop-queue
  namespace: ray-workshop
  annotations:
    opendatahub.io/managed: "false"
    kueue.x-k8s.io/default-queue: "true"
spec:
  clusterQueue: default
  stopPolicy: None
