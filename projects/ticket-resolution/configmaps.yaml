      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <script>
      (function() {
        var ZAMMAD_BASE = "https://ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com";
        var HUB_CHANNEL = 'zammad-demo-hub';
        var SESSION_KEY = 'zammad-demo-last-user';
        var SHELL_URL = (function() {
          var p = window.location.pathname.replace(/\/?$/, '/');
          return p + 'zammad-shell.html';
        })();

        function showToast(msg) {
          var el = document.getElementById('toast');
          el.textContent = msg;
          el.classList.add('show');
          clearTimeout(showToast._t);
          showToast._t = setTimeout(function() { el.classList.remove('show'); }, 3800);
        }

        function copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
          }
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
          return Promise.resolve();
        }

        function sameOriginAsZammad() {
          try {
            return new URL(ZAMMAD_BASE + '/').origin === window.location.origin;
          } catch (e) {
            return false;
          }
        }

        function browserFingerprint() {
          var key = 'zammad-demo-fp';
          try {
            var s = sessionStorage.getItem(key);
            if (s && s.length <= 160) return s;
            s = '';
            if (window.crypto && crypto.getRandomValues) {
              var buf = new Uint8Array(16);
              crypto.getRandomValues(buf);
              for (var i = 0; i < buf.length; i++) {
                s += (buf[i] < 16 ? '0' : '') + buf[i].toString(16);
              }
            } else {
              for (var j = 0; j < 32; j++) s += Math.floor(Math.random() * 16).toString(16);
            }
            sessionStorage.setItem(key, s);
            return s;
          } catch (e) {
            return 'fp' + String(Date.now()) + String(Math.random()).slice(2, 18);
          }
        }

        function signInToZammad(username, password) {
          var base = ZAMMAD_BASE + '/';
          var fp = browserFingerprint();
          var json = {
            'Content-Type': 'application/json',
            Accept: 'application/json',
            'X-Browser-Fingerprint': fp
          };
          var signshow = new URL('api/v1/signshow', base);
          var signin = new URL('api/v1/signin', base);
          return fetch(signshow.toString(), {
            method: 'POST',
            credentials: 'include',
            headers: json,
            body: JSON.stringify({ fingerprint: fp })
          }).then(function(res) {
            var csrf = res.headers.get('csrf-token') || res.headers.get('CSRF-TOKEN');
            if (!csrf) {
              throw new Error('Could not read CSRF token. Is this demo site served on the same host as Zammad?');
            }
            return fetch(signin.toString(), {
              method: 'POST',
              credentials: 'include',
              headers: Object.assign({ 'X-CSRF-Token': csrf }, json),
              body: JSON.stringify({ username: username, password: password, fingerprint: fp })
            });
          }).then(function(res) {
            if (res.status === 201) return;
            return res.text().then(function(t) {
              var j;
              try { j = t ? JSON.parse(t) : {}; } catch (e) { j = {}; }
              if (res.status === 422 && j && j.two_factor_required) {
                throw new Error('This account requires two-factor authentication. Use View all accounts to sign in manually.');
              }
              var msg = (j && (j.message || j.error || j.exception)) || t || res.statusText;
              throw new Error((msg && String(msg).trim()) || ('Sign-in failed (' + res.status + ')'));
            });
          });
        }

        var hub = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(HUB_CHANNEL) : null;

        function rememberSignedInUser(email) {
          try { localStorage.setItem(SESSION_KEY, email); } catch (e) { /* ignore */ }
        }

        function lastSignedInUser() {
          try { return localStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; }
        }

        function remoteWindowMessage() {
          var user = lastSignedInUser();
          if (user) {
            return 'This demo portal is already active in another browser window (currently ' + user + '). Switch to that window to sign in — your browser shares one Zammad session across all windows.';
          }
          return 'This demo portal is already active in another browser window. Switch to that window to sign in — your browser shares one Zammad session across all windows.';
        }

        function isLocalShellWindow(win) {
          if (!win || win.closed) return false;
          try {
            var href = win.location.href || '';
            if (!href || href === 'about:blank') return false;
            return href.indexOf('zammad-shell') !== -1 || href.indexOf(ZAMMAD_BASE) !== -1;
          } catch (e) {
            return true;
          }
        }

        function getLocalShellWindow() {
          try {
            var existing = window.open('', 'zammad-demo-window');
            if (isLocalShellWindow(existing)) return existing;
            if (existing && !existing.closed) {
              try {
                var href = existing.location.href || '';
                if (href === 'about:blank' || href === '') existing.close();
              } catch (e) { /* ignore */ }
            }
          } catch (e) { /* ignore */ }
          return null;
        }

        function probeShell(timeoutMs) {
          timeoutMs = timeoutMs || 150;
          return new Promise(function(resolve) {
            if (!hub) {
              var local = getLocalShellWindow();
              resolve({ exists: !!local, local: !!local });
              return;
            }
            var answered = false;
            function onPong(ev) {
              if (!ev.data || ev.data.action !== 'pong') return;
              answered = true;
              hub.removeEventListener('message', onPong);
              resolve({ exists: true, local: !!getLocalShellWindow() });
            }
            hub.addEventListener('message', onPong);
            hub.postMessage({ action: 'ping' });
            setTimeout(function() {
              hub.removeEventListener('message', onPong);
              if (!answered) resolve({ exists: false, local: false });
            }, timeoutMs);
          });
        }

        function focusExistingShell() {
          var existing = getLocalShellWindow();
          if (existing) {
            existing.focus();
            if (hub) hub.postMessage({ action: 'focus' });
            return true;
          }
          if (hub) hub.postMessage({ action: 'focus' });
          return false;
        }

        function openZammadShell(email, opts) {
          opts = opts || {};
          if (email) rememberSignedInUser(email);

          if (opts.remoteOnly) {
            if (email && hub) hub.postMessage({ action: 'login_changed', email: email });
            if (hub) hub.postMessage({ action: 'focus' });
            return Promise.resolve({ remote: true });
          }

          if (email && hub) hub.postMessage({ action: 'login_changed', email: email });

          return new Promise(function(resolve) {
            if (!hub) {
              var demoWin = getLocalShellWindow();
              if (demoWin) {
                demoWin.location.href = SHELL_URL;
                demoWin.focus();
              } else {
                demoWin = window.open(SHELL_URL, 'zammad-demo-window');
                if (demoWin) demoWin.focus();
              }
              resolve({ remote: false });
              return;
            }

            var shellHandled = false;
            var shellFocused = false;
            function onHubReply(ev) {
              if (ev.data && ev.data.action !== 'pong') return;
              shellHandled = true;
              shellFocused = focusExistingShell();
            }
            hub.addEventListener('message', onHubReply);
            hub.postMessage({ action: 'ping' });
            setTimeout(function() {
              hub.removeEventListener('message', onHubReply);
              if (!shellHandled) {
                var demoWin = window.open(SHELL_URL, 'zammad-demo-window');
                if (demoWin) demoWin.focus();
              }
              resolve({ remote: shellHandled && !shellFocused });
            }, 150);
          });
        }

        function updateDuplicateHint(state) {
          var hint = document.getElementById('duplicate-hint');
          if (!hint || !state || !state.exists || state.local) {
            if (hint) hint.classList.remove('is-visible');
            return;
          }
          hint.textContent = remoteWindowMessage();
          hint.classList.add('is-visible');
        }

        var duplicateModal = document.getElementById('duplicate-window-modal');
        var duplicateModalPending = null;

        function openDuplicateWindowModal(opts) {
          opts = opts || {};
          duplicateModalPending = opts.pending || null;
          var text = document.getElementById('duplicate-window-modal-text');
          var signInAnyway = document.getElementById('btn-duplicate-sign-in-anyway');
          if (text) text.textContent = opts.message || remoteWindowMessage();
          if (signInAnyway) signInAnyway.style.display = opts.allowSignInAnyway === false ? 'none' : '';
          if (!duplicateModal) return;
          duplicateModal.classList.add('is-open');
          duplicateModal.setAttribute('aria-hidden', 'false');
          document.body.classList.add('modal-open');
        }

        function closeDuplicateWindowModal() {
          duplicateModalPending = null;
          if (!duplicateModal) return;
          duplicateModal.classList.remove('is-open');
          duplicateModal.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('modal-open');
        }

        function runPersonaSignIn(email, password, sectionId, personaBtn, remoteOnly) {
          personaBtn.classList.add('is-busy');
          personaBtn.setAttribute('aria-busy', 'true');
          signInToZammad(email, password).then(function() {
            return openZammadShell(email, { remoteOnly: remoteOnly });
          }).then(function(result) {
            showToast(result && result.remote
              ? ('Signed in as ' + email + '. Switch to your other browser window — Zammad was updated there.')
              : 'Signed in. Switched to Zammad.');
          }).catch(function(err) {
            openAccountsModal(sectionId);
            showToast((err && err.message) ? err.message : 'Sign-in failed. Use View all accounts to copy credentials.');
          }).finally(function() {
            personaBtn.classList.remove('is-busy');
            personaBtn.removeAttribute('aria-busy');
          });
        }

        probeShell().then(updateDuplicateHint);

        document.getElementById('btn-duplicate-got-it').addEventListener('click', closeDuplicateWindowModal);
        document.getElementById('btn-close-duplicate-modal').addEventListener('click', closeDuplicateWindowModal);
        document.getElementById('btn-duplicate-sign-in-anyway').addEventListener('click', function() {
          var pending = duplicateModalPending;
          closeDuplicateWindowModal();
          if (pending) runPersonaSignIn(pending.email, pending.password, pending.sectionId, pending.personaBtn, true);
        });
        duplicateModal.addEventListener('click', function(e) {
          if (e.target === duplicateModal) closeDuplicateWindowModal();
        });

        var modal = document.getElementById('accounts-modal');

        function scrollAccountsBlock(id) {
          var el = id && document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function flashCopyButton(btn, kind) {
          btn.classList.remove('is-copied');
          void btn.offsetWidth;
          btn.classList.add('is-copied');
          var orig = btn.textContent;
          btn.textContent = kind === 'email' ? '✓ Email copied' : '✓ Password copied';
          clearTimeout(btn._copyFlash);
          btn._copyFlash = setTimeout(function() {
            btn.classList.remove('is-copied');
            btn.textContent = orig;
          }, 950);
        }

        function openAccountsModal(scrollToId) {
          if (!modal) return;
          modal.classList.add('is-open');
          modal.setAttribute('aria-hidden', 'false');
          document.body.classList.add('modal-open');
          if (!scrollToId) return;
          setTimeout(function() { scrollAccountsBlock(scrollToId); }, 0);
        }

        function closeAccountsModal() {
          if (!modal) return;
          modal.classList.remove('is-open');
          modal.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('modal-open');
        }

        function handleCredCopy(ev, root, sel, attr, kind, ok, err) {
          var btn = root.closest(sel);
          if (!btn) return false;
          ev.preventDefault();
          copyText(btn.getAttribute(attr) || '').then(function() {
            flashCopyButton(btn, kind);
            showToast(ok);
          }).catch(function() { showToast(err); });
          return true;
        }

        document.addEventListener('click', function(ev) {
          var t = ev.target;
          var root = t && t.nodeType === 1 ? t : t.parentElement;
          if (!root || !root.closest) return;

          if (root.closest('#btn-open-accounts-modal')) {
            openAccountsModal();
            return;
          }
          if (root.closest('#btn-close-accounts-modal')) {
            closeAccountsModal();
            return;
          }

          var chip = root.closest('.js-modal-scroll');
          if (chip) {
            scrollAccountsBlock(chip.getAttribute('data-target'));
            return;
          }

          if (handleCredCopy(ev, root, '.js-copy-email', 'data-email', 'email', 'Email copied', 'Could not copy email')) return;
          if (handleCredCopy(ev, root, '.js-copy-password', 'data-password', 'password', 'Password copied', 'Could not copy password')) return;

          if (root.closest('.js-open-zammad')) {
            ev.preventDefault();
            probeShell().then(function(state) {
              if (state.exists && !state.local) {
                openDuplicateWindowModal({
                  message: 'Zammad is already open in another browser window. Switch to that window to continue.',
                  allowSignInAnyway: false
                });
                return;
              }
              openZammadShell('');
            });
            return;
          }

          var personaBtn = root.closest('.js-persona-signin');
          if (personaBtn) {
            var email = personaBtn.getAttribute('data-email') || '';
            var password = personaBtn.getAttribute('data-password') || '';
            var sectionId = personaBtn.getAttribute('data-section') || '';
            if (!sameOriginAsZammad()) {
              openAccountsModal(sectionId);
              showToast('One-click sign-in requires this demo site to be served on the same host as Zammad.');
              return;
            }
            probeShell().then(function(state) {
              if (state.exists && !state.local) {
                openDuplicateWindowModal({
                  pending: { email: email, password: password, sectionId: sectionId, personaBtn: personaBtn },
                  allowSignInAnyway: true
                });
                return;
              }
              runPersonaSignIn(email, password, sectionId, personaBtn, false);
            });
          }
        });

        if (modal) {
          modal.addEventListener('click', function(e) {
            if (e.target === modal) closeAccountsModal();
          });
        }

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            if (duplicateModal && duplicateModal.classList.contains('is-open')) {
              closeDuplicateWindowModal();
              return;
            }
            if (modal && modal.classList.contains('is-open')) {
              closeAccountsModal();
            }
          }
        });
      })();
      </script>
    </body>
    </html>
  zammad-shell.html: |2

    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Zammad</title>
      <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
        iframe { display: block; width: 100%; height: 100%; border: none; }
      </style>
    </head>
    <body>
      <iframe id="zammad-frame" title="Zammad" src="https://ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com/"></iframe>
      <script>
      (function() {
        var ZAMMAD_BASE = "https://ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com";
        var HUB_CHANNEL = 'zammad-demo-hub';
        var frame = document.getElementById('zammad-frame');
        var hub = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(HUB_CHANNEL) : null;

        function reloadZammad() {
          if (!frame) return;
          frame.src = ZAMMAD_BASE + '/';
          window.focus();
        }

        if (hub) {
          hub.onmessage = function(ev) {
            var data = ev.data;
            if (!data || !data.action) return;
            if (data.action === 'login_changed') reloadZammad();
            if (data.action === 'focus') window.focus();
            if (data.action === 'ping') hub.postMessage({ action: 'pong' });
          };
        }
      })();
      </script>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: zammad-demo-site
  name: zammad-demo-site
  namespace: ticket-resolution
---
apiVersion: v1
data:
  elasticsearch-init: |-
    #!/bin/bash
    set -e

    ELASTICSEARCH_URL=http://self-service-agent-elasticsearch:9200
    bundle exec rails r "Setting.set('es_url', '${ELASTICSEARCH_URL}')"

    ELASTICSEARCH_USER=${ELASTICSEARCH_USER:-}
    if [ -n "${ELASTICSEARCH_USER}" ] && [ -n "${ELASTICSEARCH_PASSWORD}" ]; then
        bundle exec rails r "Setting.set('es_user', '${ELASTICSEARCH_USER}'); Setting.set('es_password', '${ELASTICSEARCH_PASSWORD}')"
    fi


    echo "Checking if an elasticsearch index already exists…"

    # Ensure ES connectivity, as SearchIndexBackend.index_exists? swallows internal errors.
    bundle exec rails r "SearchIndexBackend.version"

    if bundle exec rails r "SearchIndexBackend.index_exists?('Ticket') || exit(1)"
    then
      echo "Elasticsearch index exists, no automatic reindexing is needed."
    else
      echo "Elasticsearch index does not exist yet, create it now…"
      bundle exec rake zammad:searchindex:rebuild
    fi


    echo "elasticsearch init complete :)"
  postgresql-init: |-
    #!/bin/bash
    set -e

    if ! (bundle exec rails r 'puts User.any?' 2> /dev/null | grep -q true); then
        bundle exec rake db:migrate db:seed
    else
        echo Executing migrations...
        bundle exec rake db:migrate

        echo Synchronizing locales and translations...
        bundle exec rails r "Locale.sync; Translation.sync"
    fi

    echo "postgresql init complete :)"
  postgresql-init-post: |-
    #!/bin/bash
    set -e

    # Run a rails command to ensure the database is up and running.
    bundle exec rails r "true"

    echo "init sequence complete :)"
  zammad-init: |-
    #!/bin/bash
    set -e

    echo "zammad init complete :)"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: zammad
  name: zammad-init
  namespace: ticket-resolution
---
apiVersion: v1
data:
  default: "#\n# kubernetes nginx config for zammad\n#\n\nserver_tokens off;\n\nupstream zammad-railsserver {\n    server\
    \ zammad-railsserver:3000;\n}\n\nupstream zammad-websocket {\n    server zammad-websocket:6042;\n}\n\nserver {\n    listen\
    \ 8080;\n    listen [::]:8080;\n\n    server_name _;\n\n    root /opt/zammad/public;\n\n    client_body_temp_path /tmp\
    \ 1 2;\n    fastcgi_temp_path /tmp 1 2;\n    proxy_temp_path /tmp 1 2;\n    scgi_temp_path /tmp 1 2;\n    uwsgi_temp_path\
    \ /tmp 1 2;\n\n    access_log /dev/stdout;\n    error_log  /dev/stderr;\n\n    client_max_body_size 50M;\n    \n    \n\
    \    set_real_ip_from 10.0.0.0/8;\n    set_real_ip_from 172.16.0.0/12;\n    set_real_ip_from 192.168.0.0/16;\n    real_ip_header\
    \ X-Forwarded-For;\n    real_ip_recursive on;\n\n    location ~ ^/(assets/|robots.txt|humans.txt|favicon.ico) {\n    \
    \    expires max;\n    }\n\n    location /ws {\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n\
    \        proxy_set_header Connection \"Upgrade\";\n        proxy_set_header Host $http_host;\n        proxy_set_header\
    \ CLIENT_IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_read_timeout\
    \ 86400;\n        proxy_pass http://zammad-websocket;\n    }\n\n    location /cable {\n        proxy_http_version 1.1;\n\
    \        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection \"Upgrade\";\n        proxy_set_header\
    \ Host $http_host;\n        proxy_set_header CLIENT_IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \        proxy_read_timeout 86400;\n        proxy_pass http://zammad-railsserver;\n    }\n\n    location / {\n       \
    \ proxy_http_version 1.1;\n        proxy_set_header Host $http_host;\n        proxy_set_header CLIENT_IP $remote_addr;\n\
    \        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_read_timeout 180;\n        proxy_pass\
    \ http://zammad-railsserver;\n\n        gzip on;\n        gzip_types text/plain text/xml text/css image/svg+xml application/javascript\
    \ application/x-javascript application/json application/xml;\n        gzip_proxied any;\n    }\n}"
  nginx.conf: |-
    worker_processes auto;

    pid /tmp/nginx.pid;

    include /etc/nginx/modules-enabled/*.conf;

    events {
        worker_connections 768;
    }

    http {
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        access_log /dev/stdout;
        error_log /dev/stdout;

        gzip on;

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: zammad
  name: zammad-nginx
  namespace: ticket-resolution
