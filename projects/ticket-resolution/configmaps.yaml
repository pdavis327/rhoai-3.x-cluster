    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Zammad Chat snippet</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
        pre { background: #f5f5f5; padding: 1rem; overflow-x: auto; border-radius: 4px; }
        code { font-size: 0.9em; }
        h1 { font-size: 1.25rem; }
        #demo-site-chat-debug { white-space: pre-wrap; font-size: 0.85rem; background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 4px; max-height: 14rem; overflow: auto; }
      </style>
    </head>
    <body>
      <p><a href="index.html">← Demo site home</a></p>
      <h1>Zammad Chat snippet</h1>
      <p>Copy the following code into your website before the closing <code>&lt;/body&gt;</code> tag:</p>
      <pre><code>&lt;script src="https://ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com/assets/chat/chat-no-jquery.min.js"&gt;&lt;/script&gt;
    &lt;script&gt;
    (function() { new ZammadChat({ fontSize: '12px', chatId: 1 }); })();
    &lt;/script&gt;</code></pre>
      <p><strong>Chat button missing?</strong> An agent must be <em>available for chat</em> in Zammad (Chat panel, online). See <a href="https://admin-docs.zammad.org/en/latest/channels/chat.html">Zammad Chat docs</a>. If the channel restricts origins, add this page&apos;s origin (scheme + host).</p>
      <hr style="margin: 2rem 0; border: none; border-top: 1px solid #ddd;">
      <h2>Live preview</h2>
      <p>Scripts below load the widget from <code>https://ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com</code> (debug log + browser console).</p>
      <pre id="demo-site-chat-debug"></pre>
      <script src="https://ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com/assets/chat/chat-no-jquery.min.js"></script>
      <script>
      (function() {
        var el = document.getElementById('demo-site-chat-debug');
        function log(m) {
          if (!el) return;
          var t = (typeof m === 'string') ? m : (m && m.message ? m.message : JSON.stringify(m));
          el.textContent += t + '\n';
        }
        new ZammadChat({
          fontSize: '12px',
          chatId: 1,
          debug: true,
          onError: function(m) { log('onError: ' + (m || '(empty)')); },
          onReady: function() { log('onReady'); },
          onConnectionEstablished: function() { log('onConnectionEstablished'); }
        });
      })();
      </script>
    </body>
    </html>
  default.conf: |
    server {
        listen 8080;
        server_name ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com;
        # Route edge TLS; pod sees HTTP on :8080—avoid absolute redirects with wrong scheme/port.
        port_in_redirect off;
        absolute_redirect off;
        server_name_in_redirect off;
        # Internal rewrite only (no 301 to client): /demo-portal → /demo-portal/
        location = /demo-portal {
            rewrite '^/demo-portal$' '/demo-portal/' last;
        }
        location /demo-portal/ {
            alias /usr/share/nginx/html/;
            index index.html;
        }
    }
