        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        body.modal-open { overflow: hidden; }
        button.btn-view-all {
          width: 100%;
          margin-bottom: 0.5rem;
          padding: 0.45rem 0.85rem;
          border-radius: 10px;
