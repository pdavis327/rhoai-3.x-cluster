  byod_network_access.txt: "Bring Your Own Device (BYOD) Network Access Policy\n\nPurpose:\nTo establish guidelines for employees\
    \ connecting personal devices (phones, tablets, laptops) to corporate resources while maintaining data security and employee\
    \ privacy.\n\n\t1\tScope: This policy applies to all employees, contractors, and consultants who wish to use personally\
    \ owned devices for work purposes, including smartphones, tablets, and laptops.\n\t2\tEligible Devices\n\t\t- Smartphones:\
    \ iOS 16+ or Android 13+.\n\t\t- Tablets: iPadOS 16+ or Android 13+.\n\t\t- Laptops: Windows 11, macOS 13+, or ChromeOS\
    \ 116+.\n\t\t- Devices running unsupported or end-of-life operating systems are not permitted.\n\t\t- Rooted, jailbroken,\
    \ or otherwise modified devices are prohibited.\n\t3\tEnrollment Requirements\n\t\t- Device must meet minimum OS version\
    \ (see section 2).\n\t\t- Device must have a screen lock enabled (PIN, biometric, or password with 6+ characters).\n\t\
    \t- Full disk encryption must be active (enabled by default on modern iOS/Android; BitLocker or FileVault for laptops).\n\
    \t\t- Employee must install the company Mobile Device Management (MDM) profile.\n\t\t- Employee must read and accept the\
    \ BYOD Acceptable Use Agreement.\n\t4\tHow To: Enroll a Personal Device\n\t\t- Step 1: Connect to GUEST-NETWORK Wi-Fi\
    \ (no corporate access yet).\n\t\t- Step 2: Open a browser and navigate to https://byod.company.com.\n\t\t- Step 3: Log\
    \ in with your corporate credentials.\n\t\t- Step 4: Select your device type (phone, tablet, or laptop).\n\t\t- Step 5:\
    \ Follow the on-screen prompts to install the MDM profile/agent.\n\t\t- Step 6: The MDM agent will verify your device\
    \ meets requirements (OS version, encryption, screen lock).\n\t\t- Step 7: Once verified, you will receive access to the\
    \ CORP-BYOD Wi-Fi network and corporate apps.\n\t\t- Enrollment typically completes within 5 minutes. If verification\
    \ fails, the portal will indicate which requirements are not met.\n\t5\tWhat MDM Can and Cannot Access\n\t\t- MDM CAN:\
    \ enforce screen lock policy, require encryption, remotely wipe corporate data (container only), verify OS version, push\
    \ corporate apps, revoke access.\n\t\t- MDM CANNOT: read personal emails, view photos or personal files, track browsing\
    \ history, access personal apps, see personal call/text logs.\n\t\t- Corporate data is isolated in a secure container\
    \ separate from personal data.\n\t6\tNetwork Access Levels\n\t\t- GUEST-NETWORK: internet-only, no access to internal\
    \ resources. No enrollment required.\n\t\t- CORP-BYOD: access to corporate email, calendar, intranet, and approved cloud\
    \ apps. Requires MDM enrollment.\n\t\t- CORP-SECURE (certificate-based): full corporate network. Reserved for company-issued\
    \ devices only; BYOD devices cannot join this network.\n\t7\tAcceptable Use\n\t\t- BYOD devices may access corporate email,\
    \ calendar, messaging, intranet, and approved SaaS applications.\n\t\t- Storing corporate data outside the managed container\
    \ (e.g., personal cloud storage, screenshots of confidential material) is prohibited.\n\t\t- Sharing the device with family\
    \ members or others does not grant them access to corporate resources (container requires separate authentication).\n\t\
    8\tSecurity Requirements (Ongoing)\n\t\t- Keep the operating system and apps updated; devices more than 30 days behind\
    \ on security patches will have access suspended.\n\t\t- Do not disable MDM, encryption, or screen lock after enrollment.\n\
    \t\t- Report a lost or stolen device to IT Helpdesk immediately — IT will remotely wipe the corporate container only.\n\
    \t\t- If malware is suspected on your device, disconnect from corporate networks and contact IT.\n\t9\tHow To: Report\
    \ a Lost or Stolen Device\n\t\t- Step 1: Call IT Helpdesk at +1-800-555-HELP (4357) or submit an urgent request at https://helpdesk.company.com.\n\
    \t\t- Step 2: IT will remotely wipe the corporate container (personal data is not affected).\n\t\t- Step 3: Change your\
    \ corporate password immediately (see password_reset.txt).\n\t\t- Step 4: Once you have a replacement device, re-enroll\
    \ following section 4.\n\t10\tHow To: Remove BYOD Enrollment (Offboarding)\n\t\t- Step 1: Navigate to https://byod.company.com\
    \ and log in.\n\t\t- Step 2: Select your device and click \"Unenroll.\"\n\t\t- Step 3: The corporate container and MDM\
    \ profile will be removed from your device.\n\t\t- Step 4: Personal data, apps, and settings are not affected.\n\t\t-\
    \ Employees leaving the company will have their devices automatically unenrolled and the corporate container wiped on\
    \ their last day.\n\t11\tTroubleshooting: Cannot Connect to CORP-BYOD After Enrollment\n\t\t- Verify MDM profile is still\
    \ installed (Settings > Device Management or equivalent).\n\t\t- Confirm your device OS is up to date and not more than\
    \ 30 days behind on patches.\n\t\t- Forget the CORP-BYOD network and reconnect.\n\t\t- Restart the device.\n\t\t- If access\
    \ is still denied, your enrollment may have been revoked — re-enroll via section 4 or contact IT Helpdesk.\n\t12\tTroubleshooting:\
    \ MDM Enrollment Fails\n\t\t- Ensure your device meets minimum OS requirements (section 2).\n\t\t- Verify screen lock\
    \ and encryption are enabled before attempting enrollment.\n\t\t- Check that you are connected to GUEST-NETWORK (not mobile\
    \ data) during enrollment.\n\t\t- Clear browser cache and retry.\n\t\t- If the device is rooted/jailbroken, it cannot\
    \ be enrolled.\n\t\t- Contact IT Helpdesk if the issue persists.\n\nEffective Date: January 15th, 2025\nApproved by: IT\
    \ Governance Committee\n"
