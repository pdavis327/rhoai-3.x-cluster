      annotations:
        trustyai.opendatahub.io/nemo-config-hash: ead77e379f9b22bbef4149016f44cec85e24f7e070868e3f9d8d174c943adf4f
      creationTimestamp: null
      labels:
        app: nemo-guardrails
        app.kubernetes.io/instance: nemo-guardrails
        app.kubernetes.io/name: nemo-guardrails
        app.kubernetes.io/part-of: trustyai
