apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: llamastack
  name: llamastack
  namespace: ticket-resolution
spec:
  progressDeadlineSeconds: 3600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: self-service-agent
      app.kubernetes.io/name: llamastack
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app.kubernetes.io/instance: self-service-agent
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: llamastack
        app.kubernetes.io/version: 0.8.5
        helm.sh/chart: llama-stack-0.8.5
    spec:
      containers:
      - env:
        - name: RUN_CONFIG_PATH
          value: /app-config/config.yaml
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: pgvector
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: pgvector
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: pgvector
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              key: port
              name: pgvector
        - name: POSTGRES_DBNAME
          valueFrom:
            secretKeyRef:
              key: dbname
              name: pgvector
        envFrom:
        - secretRef:
            name: llama-stack-env
        image: ogxai/distribution-starter:0.5.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /v1/health
            port: 8321
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: llama-stack
        ports:
        - containerPort: 8321
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /v1/health
            port: 8321
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 10
        resources: {}
        securityContext: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app-config
          name: run-config-volume
        - mountPath: /.llama
          name: dot-llama
        - mountPath: /.cache
          name: cache
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/bash
        - -c
        - "set -e\n# Function to resolve ${env.VAR} syntax to actual env var values\nresolve_env_var() {\n  local val=\"$1\"\
          \n  if [[ \"$val\" =~ ^\\$\\{env\\.([^}]+)\\}$ ]]; then\n    echo \"${!BASH_REMATCH[1]}\"\n  else\n    echo \"$val\"\
          \n  fi\n}\nfor url_data in https://llama-3-2-1b-instruct-kserve-workload-svc.model-server.svc.cluster.local:8000/v1/models\
          \ ; do\n  url_components=(${url_data//#/ })\n  url=${url_components[0]}\n  auth=$(resolve_env_var \"${url_components[1]}\"\
          )\n  echo \"Waiting for $url...\"\n  curl_options=(\"-ksf\" \"$url\")\n  if [[ -n \"$auth\" ]]; then\n    curl_options+=(\"\
          -H\" \"Authorization: Bearer $auth\")\n  fi\n  until curl \"${curl_options[@]}\"; do\n    echo \"Still waiting for\
          \ $url ...\"\n    sleep 10\n  done\n  echo \"$url is ready.\"\ndone\necho \"All services are up.\"\n"
        envFrom:
        - secretRef:
            name: llama-stack-env
        image: ogxai/distribution-starter:0.5.2
        imagePullPolicy: IfNotPresent
        name: wait-for-models
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: run-config
        name: run-config-volume
      - emptyDir: {}
        name: dot-llama
      - emptyDir: {}
        name: cache
---
