        deploy-name: nemo-guardrails
    spec:
      containers:
      - env:
        - name: CONFIG_ID
          value: nemo-config
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: OPENAI_API_KEY
          value: fake
        image: registry.redhat.io/rhoai/odh-trustyai-nemo-guardrails-server-rhel9@sha256:d6221e450b487cbf4adf25298e428452e231a33bfbffd15ca381284501b09c93
        imagePullPolicy: IfNotPresent
        name: nemo-guardrails
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 12
          httpGet:
            path: /
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/config/nemo-config
          name: nemo-config-nemo-config-volume
        - mountPath: /etc/ssl/certs/
          name: ca-bundle-transfer
          readOnly: true
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /bin/sh
        - -c
        - "#!/bin/sh\nset -e\noutput_file=\"/tmp/ca-bundle-transfer//ca-certificates.crt\"\n\n# Clear the output file\n> \"\
          $output_file\"\n\n# Process each validated key file (keys are pre-validated)\nfor file_path in \"/tmp/odh-trusted-ca-bundle//ca-bundle.crt\"\
          \ \"/tmp/openshift-serving-ca-bundle//service-ca.crt\"; do\n    if [ -f \"$file_path\" ]; then\n        cat \"$file_path\"\
          \ >> \"$output_file\"\n        echo >> \"$output_file\"  # Add newline between certificates\n    else\n        echo\
          \ \"Warning: Certificate file $file_path not found\" >&2\n    fi\ndone"
        image: registry.redhat.io/rhoai/odh-trustyai-nemo-guardrails-server-rhel9@sha256:d6221e450b487cbf4adf25298e428452e231a33bfbffd15ca381284501b09c93
        imagePullPolicy: IfNotPresent
        name: ca-bundle-initializer
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp/ca-bundle-transfer/
          name: ca-bundle-transfer
        - mountPath: /tmp/odh-trusted-ca-bundle/
          name: odh-trusted-ca-bundle-vol
        - mountPath: /tmp/openshift-serving-ca-bundle/
          name: nemo-guardrails-ca-bundle-vol
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: tls-certs
        secret:
          defaultMode: 420
          secretName: nemo-guardrails-tls
      - configMap:
          defaultMode: 420
          name: nemo-config
        name: nemo-config-nemo-config-volume
      - configMap:
          defaultMode: 420
          name: odh-trusted-ca-bundle
        name: odh-trusted-ca-bundle-vol
      - configMap:
          defaultMode: 420
          name: nemo-guardrails-ca-bundle
        name: nemo-guardrails-ca-bundle-vol
      - emptyDir: {}
        name: ca-bundle-transfer
