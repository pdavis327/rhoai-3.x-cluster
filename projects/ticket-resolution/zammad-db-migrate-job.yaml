apiVersion: batch/v1
kind: Job
metadata:
  name: zammad-db-migrate
  namespace: ticket-resolution
  labels:
    app.kubernetes.io/name: zammad
    app.kubernetes.io/component: zammad-init
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad
        app.kubernetes.io/component: zammad-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ghcr.io/zammad/zammad:7.0.0-0021
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          set -e
          bundle exec rake db:migrate db:seed
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-password
              name: zammad-redis-pass
        - name: REDIS_URL
          value: redis://:$(REDIS_PASSWORD)@self-service-agent-redis:6379
        - name: MEMCACHE_SERVERS
          value: self-service-agent-memcached:11211
        - name: POSTGRESQL_HOST
          value: self-service-agent-postgresql
        - name: POSTGRESQL_PORT
          value: '5432'
        - name: POSTGRESQL_USER
          value: zammad
        - name: POSTGRESQL_PASS
          valueFrom:
            secretKeyRef:
              key: postgresql-pass
              name: zammad-postgresql-pass
        - name: POSTGRESQL_DB
          value: zammad_production
        - name: POSTGRESQL_OPTIONS
          value: pool=50
        - name: TMP
          value: /opt/zammad/tmp
        - name: ZAMMAD_FQDN
          value: ssa-zammad-ticket-resolution.apps.ocp.cjrcx.sandbox1524.opentlc.com
        - name: ZAMMAD_HTTP_TYPE
          value: https
        - name: AUTOWIZARD_RELATIVE_PATH
          value: tmp/auto_wizard/auto_wizard.json
        - name: RAILS_CHECK_PENDING_MIGRATIONS
          value: 'false'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp
          name: zammad-tmp
        - mountPath: /opt/zammad/tmp
          name: zammad-tmp
        - mountPath: /opt/zammad/tmp/auto_wizard
          name: autowizard
      volumes:
      - emptyDir:
          sizeLimit: 100Mi
        name: zammad-tmp
      - name: autowizard
        secret:
          defaultMode: 420
          items:
          - key: autowizard
            path: auto_wizard.json
          secretName: zammad-autowizard
